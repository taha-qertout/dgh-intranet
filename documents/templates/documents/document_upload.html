{% extends "base.html" %}

{% block title %}Ajouter un document – Intranet DGH{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title h4 mb-3">Ajouter un document</h1>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Téléverser</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
