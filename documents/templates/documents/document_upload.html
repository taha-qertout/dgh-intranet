{% extends "base.html" %}

{% block title %}Ajouter un document – Intranet DGH{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="dgh-card p-4">
            <h1 class="h4 mb-3">Ajouter un document</h1>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% include "_form_fields.html" %}
                <button type="submit" class="btn btn-primary">Téléverser</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
