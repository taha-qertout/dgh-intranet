{% extends "base.html" %}

{% block title %}Connexion – Intranet DGH{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title h4 mb-3">Se connecter</h1>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Identifiants invalides. Merci de réessayer.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>

                <p class="mt-3 mb-0">
                    <a href="{% url 'password_reset' %}">Mot de passe oublié ?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
