{% extends "base.html" %}

{% block title %}Connexion – Intranet DGH{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="dgh-card p-4 w-100" style="max-width: 420px;">
        <h1 class="h4 mb-3">Se connecter</h1>

        {% if form.errors %}
        <div class="alert alert-danger">
            Identifiants invalides. Merci de réessayer.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% include "_form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
        </form>

        <p class="mt-3 mb-0">
            <a href="{% url 'password_reset' %}">Mot de passe oublié ?</a>
        </p>
    </div>
</div>
{% endblock %}
